name: Apply bundle
on:
  push:
    branches: [main]
    paths: ['bundle-*.zip']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: apply-bundle
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded bundles
        run: |
          shopt -s nullglob
          files=(bundle-*.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to apply"; exit 0; fi
          for z in "${files[@]}"; do
            unzip -o -q "$z" -d .
            git rm -q "$z"
          done
          if [ -f _delete.txt ]; then
            while IFS= read -r p; do
              if [ -n "$p" ] && [ -e "$p" ]; then git rm -q -- "$p"; fi
            done < _delete.txt
            rm -f _delete.txt
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded bundle" || exit 0
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed, make a small normal commit instead"
